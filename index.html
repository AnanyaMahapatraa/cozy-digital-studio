<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Digital Studio</title>
<style>
  :root { --ink:#38271f; --wood:#8d5737; --wood2:#bd8557; --cream:#f3dfbd; --leaf:#d97732; --scene-bg:#fffaf5; --outer-bg:#181818; --element-hue:0deg; --band:#e8b94f; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; background:var(--outer-bg); overflow:hidden; }
  body { font-family:system-ui,sans-serif; }
  .widget-shell { position:relative; isolation:isolate; width:100%; min-height:100%; display:flex; align-items:center; justify-content:center; padding:clamp(28px,9vmin,90px) clamp(24px,9vw,120px); background:var(--outer-bg); border-radius:0; transition:background .2s ease; }
  .studio-card { position:relative; z-index:1; width:100%; max-width:860px; margin:auto; padding:10px; background:var(--scene-bg); border:1px solid rgba(105,67,47,.12); border-radius:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); overflow:hidden; }
  .scene { position:relative; width:100%; height:clamp(250px, 48vw, 350px); min-height:250px; overflow:hidden; border-radius:14px; background:var(--scene-bg); touch-action:manipulation; transition:background .2s ease; }
  .floor { position:absolute; left:2%; right:2%; bottom:22px; height:2px; background:rgba(173,126,82,.65); border-radius:2px; }
  .zone { position:absolute; bottom:24px; width:28%; height:72%; cursor:pointer; }
  .library { left:1%; width:27%; }
  .desk { left:31%; width:29%; }
  .music { left:61%; width:18%; }
  .closet { left:80%; width:19%; }
  /* Teddy shares the wardrobe's box and viewBox; it is never positioned separately. */
  .teddy-layer { z-index:7; }
  svg.furniture-plain { width:100%; height:100%; overflow:visible; display:block; }
  svg.furniture { width:100%; height:100%; overflow:visible; filter:hue-rotate(var(--element-hue)); }
  .label { position:absolute; bottom:2px; width:100%; text-align:center; color:rgba(113,78,52,.8); font:10px/1.2 system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
  #girl { position:absolute; z-index:8; width:clamp(48px, 7.5vw, 62px); height:clamp(90px, 14vw, 108px); bottom:17px; left:4%; transform-origin:50% 90%; background-repeat:no-repeat; background-position:center bottom; background-size:contain; filter:none; will-change:left,background-image; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; outline-offset:3px; }
  #girl:active { cursor:grabbing; }
  #girl:focus-visible { outline:2px solid #bd8557; border-radius:12px; }
  #girl.walking { animation:step-bob 1.2s ease-in-out infinite; }
  #girl.walking.facing-left { transform:scaleX(-1); }
  #girl.reaching.facing-left { transform:scaleX(-1); }
  #girl.stopping { animation:idle-bob 4s ease-in-out infinite; }
  #girl.browsing { animation:idle-bob 4.5s ease-in-out infinite; }
  #girl.floor-sitting { animation:idle-bob 5s ease-in-out infinite; }
  #girl.music-pose { animation:idle-bob 3.5s ease-in-out infinite; }
  #girl.reaching { animation:idle-bob 4.5s ease-in-out infinite; }
  @keyframes step-bob { 0%,100% { translate:0 0; } 50% { translate:0 -1px; } }
  @keyframes idle-bob { 0%,100% { translate:0 0; } 50% { translate:0 -1px; } }
  @media (prefers-reduced-motion: reduce) { #girl { animation:none!important; } .leaf { animation-play-state:paused!important; } }
  .leaf { position:absolute; top:-18px; z-index:6; color:var(--leaf); opacity:.85; width:13px; height:16px; animation:fall linear infinite; pointer-events:none; }
  .leaf svg { width:100%; height:100%; display:block; overflow:visible; }
  .ukulele-customize { position:absolute; z-index:12; left:30%; top:12%; width:9%; height:20%; border:0; padding:0; background:transparent; cursor:pointer; }
  .ukulele-customize:focus-visible { outline:2px solid #bd8557; outline-offset:2px; border-radius:8px; }
  .custom-panel { position:absolute; z-index:20; top:8px; right:8px; width:min(230px, 68%); padding:12px; border:1px solid rgba(105,67,47,.25); border-radius:12px; background:rgba(255,248,235,.97); color:#38271f; box-shadow:0 6px 22px rgba(56,39,31,.15); font:12px/1.3 system-ui,sans-serif; }
  .custom-panel[hidden] { display:none; }
  .custom-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; font-weight:700; }
  .custom-close { border:0; background:transparent; color:#69432f; font-size:18px; line-height:1; cursor:pointer; padding:0 2px; }
  .color-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:7px 0; }
  .color-row label { flex:1; }
  .color-row input[type=color] { width:36px; height:25px; padding:1px; border:1px solid rgba(105,67,47,.25); border-radius:6px; background:white; cursor:pointer; }
  .custom-note { margin-top:8px; color:#8a6b53; font-size:10px; }
  .leaf:nth-of-type(1){left:18%;animation-duration:28s;animation-delay:-8s}
  .leaf:nth-of-type(2){left:48%;animation-duration:32s;animation-delay:-19s}
  .leaf:nth-of-type(3){left:78%;animation-duration:29s;animation-delay:-12s}
  .leaf:nth-of-type(4){left:32%;animation-duration:31s;animation-delay:-23s}
  .leaf:nth-of-type(5){left:64%;animation-duration:30s;animation-delay:-6s}
  .leaf:nth-of-type(6){left:88%;animation-duration:33s;animation-delay:-17s}
  @keyframes fall { 0%{transform:translate(0,-15px) rotate(0);opacity:0} 8%{opacity:.78} 28%{transform:translate(10px,28vh) rotate(35deg);opacity:.78} 55%{transform:translate(-9px,56vh) rotate(90deg);opacity:.78} 78%{transform:translate(14px,80vh) rotate(145deg);opacity:.7} 100%{transform:translate(-5px,105vh) rotate(190deg);opacity:0} }
  .hint { position:absolute; top:8px; left:0; right:0; text-align:center; font-size:10px; color:rgba(120,87,63,.68); letter-spacing:.06em; pointer-events:none; }
  @media (max-height:220px) { .scene{height:240px}.zone{height:170px} }
  @media (max-width:420px) { .widget-shell{padding:clamp(28px,9vmin,60px) 22px}.studio-card{padding:7px;border-radius:18px}.scene{height:clamp(250px,58vw,330px);min-height:250px}}
  @media (prefers-reduced-motion: reduce) { #girl.walking,#girl.running,#girl.stopping,#girl .leg,#girl .arm,.leaf{animation-play-state:paused!important} }

  /* v13: smaller character and slower alternating footfall frames */
  #girl.walking.facing-left { animation: slow-walk-left 0.92s steps(1, end) infinite; }
  #girl.walking.facing-right { animation: slow-walk-right 0.92s steps(1, end) infinite; }
  #girl.running.facing-left { animation: slow-walk-left 0.92s steps(1, end) infinite; }
  #girl.running.facing-right { animation: slow-walk-right 0.92s steps(1, end) infinite; }
  @keyframes slow-walk-left {
    0%, 49.9% { background-position:100% 0%; }
    50%, 100% { background-position:0% 50%; }
  }
  @keyframes slow-walk-right {
    0%, 49.9% { background-position:33.333% 50%; }
    50%, 100% { background-position:66.667% 50%; }
  }


  /* v15: normalized frame canvases keep the character's height and baseline stable. */
  html, body { max-width:100%; overflow-x:hidden; }
  .scene { width:100%; max-width:100%; overflow:hidden; }
  #girl { background-size:100% 100%; background-position:center center; }
  #girl.walking { animation: step-bob 1.8s ease-in-out infinite; }
  #girl.walking.facing-left, #girl.walking.facing-right { transform-origin:50% 100%; }
  #girl.floor-sitting { bottom:17px; }
  #girl.walking.facing-left { animation:step-bob 1.8s ease-in-out infinite; }
  #girl.walking.facing-right { animation:step-bob 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { #girl { animation:none!important; } }


  /* v29: keep a single idle full-body sprite to prevent the brief wider/shorter silhouette pop. */
  #girl {
    width:clamp(56px, 10vw, 76px);
    height:clamp(100px, 18vw, 132px);
    bottom:17px;
    background-size:100% 100%;
    background-position:center center;
    background-repeat:no-repeat;
    transform-origin:50% 92%;
    filter:none;
    will-change:left,background-image,translate,rotate;
  }
  /* v27: remove detached ground-shadow artifacts and keep character movement subtle and scale-stable. */
  /* Frame canvases remain 240x320 with a shared baseline; the sitting pose keeps its natural width. */
  #girl.idle-proportion { background-size:100% 100%; }
  #girl.walking { animation: natural-walk-bob .72s ease-in-out infinite; }
  #girl.walking.facing-left { transform:scaleX(-1); }
  #girl.walking.facing-right { transform:scaleX(1); }
  #girl.stopping { animation: gentle-idle 3.4s ease-in-out infinite; }
  #girl.floor-sitting { animation: seated-breathe 4s ease-in-out infinite; }
  @keyframes natural-walk-bob {
    0%,100% { translate:0 0; rotate:0deg; }
    25% { translate:0 -1px; rotate:-.2deg; }
    50% { translate:0 -.2px; rotate:0deg; }
    75% { translate:0 -.6px; rotate:.2deg; }
  }
  @keyframes gentle-idle {
    0%,100% { translate:0 0; rotate:0deg; }
    50% { translate:0 -.6px; rotate:.12deg; }
  }
  @keyframes seated-breathe {
    0%,100% { translate:0 0; rotate:0deg; }
    50% { translate:0 -0.4px; rotate:.08deg; }
  }
  @media (prefers-reduced-motion: reduce) {
    #girl.walking,#girl.stopping,#girl.floor-sitting { animation:none!important; }
  }

</style>

<script>
(() => {
  const girl=document.getElementById('girl'), scene=document.querySelector('.scene');
  const panel=document.getElementById('customPanel');
  const studioCard=document.querySelector('.studio-card');
  const widgetShell=document.getElementById('widgetShell');
  const outerColor=document.getElementById('outerColor');
  outerColor.addEventListener('input',e=>{widgetShell.style.setProperty('--outer-bg',e.target.value);document.documentElement.style.setProperty('--outer-bg',e.target.value);});
  const ukuleleButton=document.querySelector('.ukulele-customize');
  const colorInputs={bg:document.getElementById('bgColor'), elements:document.getElementById('elementColor'), leaves:document.getElementById('leafColor')};
  colorInputs.bg.addEventListener('input',e=>{scene.style.setProperty('--scene-bg',e.target.value);studioCard.style.setProperty('--scene-bg',e.target.value);});
  colorInputs.elements.addEventListener('input',e=>{
    const c=hexToRgb(e.target.value), base=hexToRgb('#bd8557');
    const hue=(rgb)=>{const r=rgb.r/255,g=rgb.g/255,b=rgb.b/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return h;};
    let delta=hue(c)-hue(base); if(delta>180)delta-=360;if(delta< -180)delta+=360;
    scene.style.setProperty('--element-hue',delta+'deg');
  });
  colorInputs.leaves.addEventListener('input',e=>{scene.style.setProperty('--leaf',e.target.value);widgetShell.style.setProperty('--leaf',e.target.value);});
  ukuleleButton.addEventListener('click',e=>{e.stopPropagation();panel.hidden=!panel.hidden;});
  panel.addEventListener('click',e=>e.stopPropagation());
  document.getElementById('closeCustom').addEventListener('click',()=>panel.hidden=true);


  // Character destinations stay in the open studio area; the wardrobe is decorative only.
  const stops=[
    {x:.15,kind:'open',wait:3200},
    {x:.42,kind:'open',wait:4200},
    {x:.66,kind:'open',wait:3600}
  ];
  let index=0,timer=null,userDirected=false,travelCount=0;

  };
  function clear(){if(timer)clearTimeout(timer);timer=null;}
  let walkTimer=null,walkFrame=0;
  const walkFrames=['walkA','walkB','walkC','walkD'];
  function stopWalkCycle(){if(walkTimer)clearInterval(walkTimer);walkTimer=null;}
  function setFrame(name){girl.style.backgroundImage=`url("${frames[name]||frames.front}")`;}
  // Stable idle rendering: keep one consistent full-body front sprite while standing.
  // Swapping to separate full-body blink/laugh/hair sprites caused a brief silhouette
  // jump because those illustrations do not have identical body proportions.
  let expressionBusy=false;
  function updateFrame(){
    if(girl.classList.contains('walking')){setFrame(walkFrames[walkFrame%walkFrames.length]);return;}
        if(girl.classList.contains('floor-sitting')){setFrame('floor');return;}
    if(girl.classList.contains('reaching')){setFrame('reach');return;}
    if(girl.classList.contains('music-pose')){setFrame('wave');return;}
    if(girl.classList.contains('browsing')){setFrame(girl.classList.contains('facing-left')?'left':'right');return;}
    if(girl.classList.contains('stopping')){setFrame('front');return;}
    setFrame(girl.classList.contains('facing-left')?'left':'right');
  }
  function pose(p){
    stopWalkCycle();
    girl.classList.remove('walking','running','stopping','reading','music-pose','browsing','floor-sitting','reaching','look-down','idle-proportion');
    girl.classList.add(p);
    if(p==='stopping') girl.classList.add('idle-proportion');
    if(p==='walking'){
      walkFrame=0;updateFrame();
      walkTimer=setInterval(()=>{walkFrame=(walkFrame+1)%walkFrames.length;updateFrame();},210);
    }else updateFrame();
  }
  function face(dir){
    girl.classList.remove('facing-left','facing-right');
    girl.classList.add(dir==='left'?'facing-left':'facing-right');
    updateFrame();
  }
  function scheduleNext(delay){timer=setTimeout(()=>{if(!userDirected)autonomousAction()},delay);}
  function settleAt(s,dir){
    // Every destination uses the same calm standing pose: no reaching, browsing, or wardrobe reaction.
    girl.style.transition='none';
    pose('stopping');
    face('right');
    if(userDirected){timer=setTimeout(()=>{userDirected=false;autonomousAction();},s.wait);}else scheduleNext(s.wait);
  }
  function moveTo(n,auto=false){
    clear(); index=(n+stops.length)%stops.length; const s=stops[index];
    const max=Math.max(0,scene.clientWidth-girl.clientWidth-4);
    const target=Math.max(0,Math.min(max,Math.round(scene.clientWidth*s.x-girl.clientWidth/2)));
    const cur=girl.offsetLeft,dir=target>=cur?'right':'left',dist=Math.abs(target-cur);
    face(dir); girl.classList.remove('look-down');
    const running=false; // This character should stroll, not rush.
    pose('walking');
    const pxPerSecond=40,ms=Math.max(1800,dist/pxPerSecond*1000);
    girl.style.transition=`left ${ms}ms cubic-bezier(.42,0,.2,1)`; girl.style.left=target+'px';
    timer=setTimeout(()=>settleAt(s,dir),ms);
  }
  function autonomousAction(){
    if(reduced||userDirected)return;
    const action=Math.floor(Math.random()*7);
    if(action===0){pose('floor-sitting');face(Math.random()<.5?'left':'right');scheduleNext(8000+Math.random()*5000);return;}
    if(action===1){pose('stopping');face('right');scheduleNext(1800+Math.random()*1800);return;}
    if(action===2){moveTo(0,true);return;}
    if(action===3){moveTo(1,true);return;}
    moveTo(Math.floor(Math.random()*stops.length),true);
  }
  function choose(n){userDirected=true;moveTo(n,false);}
  document.querySelectorAll('.zone[data-stop]').forEach(el=>{el.addEventListener('click',()=>choose(Number(el.dataset.stop)));el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&el.tagName!=='BUTTON'){e.preventDefault();choose(Number(el.dataset.stop));}})});
  // Character control is intentionally click/tap only: no dragging, so a tap
  // can never accidentally reposition the character.
  function isMoving(){return girl.classList.contains('walking')||girl.classList.contains('running');}
  function stopOnSpot(){
    clear(); userDirected=true;
    const left=girl.offsetLeft;
    girl.style.transition='none';
    girl.style.left=left+'px';
    pose('stopping'); face('right');
  }
  function startWalking(){
    clear(); userDirected=true;
    // Start from the character's current position and walk to the next destination.
    const next=(index+1)%stops.length;
    moveTo(next,false);
  }
  girl.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    if(isMoving()) stopOnSpot();
    else startWalking();
  });
  girl.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();if(isMoving())stopOnSpot();else startWalking();}
  });
  window.addEventListener('resize',()=>{if(reduced)return;clear();const max=Math.max(0,scene.clientWidth-girl.clientWidth-4);girl.style.transition='none';girl.style.left=Math.min(girl.offsetLeft,max)+'px';timer=setTimeout(()=>moveTo(index,true),350)});
  girl.style.left=Math.max(0,Math.round(scene.clientWidth*.15-girl.clientWidth/2))+'px';face('right');pose('stopping');if(!reduced)timer=setTimeout(()=>autonomousAction(),1400);
})();
</script>
